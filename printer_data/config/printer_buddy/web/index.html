<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Printer Buddy - 3D Printer Management</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1 class="logo">Printer Buddy</h1>
                <div class="header-status">
                    <div class="status-indicator" id="connectionStatus">
                        <span class="status-dot offline"></span>
                        <span class="status-text">Connecting...</span>
                    </div>
                    <button id="emergencyStop" class="emergency-stop">
                        <span class="emergency-icon">⚠</span>
                        Emergency Stop
                    </button>
                </div>
            </div>
        </header>

        <!-- Simple Status Bar -->
        <div class="status-bar-simple">
            <div class="status-item">
                <strong>Fans:</strong> 
                <span class="status-indicator">●</span>
                <span id="fansStatus">--</span>
            </div>
            <div class="status-item">
                <strong>Position:</strong> 
                X: <span id="xPositionSimple">--</span>&nbsp;&nbsp;
                Y: <span id="yPositionSimple">--</span>&nbsp;&nbsp;
                Z: <span id="zPositionSimple">--</span>
            </div>
            <div class="status-item">
                <strong>Temps:</strong> 
                Bed: <span id="bedTempSimple">--</span>&nbsp;&nbsp;
                Extruder: <span id="extruderTempSimple">--</span>
            </div>
        </div>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Control Panel -->
            <div class="panel-grid">
                
                <!-- Commissioning Panel -->
                <div class="panel" id="commissioningPanel">
                    <div class="panel-header">
                        <h2>Printer Tests - Choose Below</h2>
                        <button class="panel-toggle" data-panel="commissioning">−</button>
                    </div>
                    <div class="panel-content">
                        <div class="commissioning-tests">
                            <div class="test-selector">
                                <label for="testDropdown">Select Test:</label>
                                <select id="testDropdown" class="test-dropdown">
                                    <option value="">Choose a test...</option>
                                </select>
                            </div>
                            
                            <div id="selectedTestContainer" class="selected-test-container" style="display: none;">
                                <div id="testPanel" class="test-panel-placeholder">
                                    <div class="placeholder-content">
                                        <h3 id="selectedTestName">Test Panel Loading...</h3>
                                        <p>This is where the dynamic test panel will appear.</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Controls Panel -->
                <div class="panel" id="controlsPanel">
                    <div class="panel-header">
                        <h2>Controls</h2>
                        <button class="panel-toggle" data-panel="controls">−</button>
                    </div>
                    <div class="panel-content">
                        <!-- Manual Jog Controls -->
                        <div class="control-section">
                            <h3>Manual Jog</h3>
                            <div class="jog-controls">
                                <!-- Distance Selection -->
                                <div class="distance-controls">
                                    <label>Move Distance:</label>
                                    <div class="distance-buttons">
                                        <button class="distance-btn active" data-distance="0.01">0.01mm</button>
                                        <button class="distance-btn" data-distance="1">1mm</button>
                                        <button class="distance-btn" data-distance="25">25mm</button>
                                    </div>
                                </div>
                                
                                <!-- Movement Controls (Organized by Axis) -->
                                <div class="movement-controls">
                                    <div class="axis-columns">
                                        <div class="axis-column">
                                            <button class="movement-btn" data-axis="x" data-direction="-x">
                                                <span class="btn-label">X-</span>
                                                <span class="btn-arrow">←</span>
                                            </button>
                                            <button class="movement-btn" data-axis="x" data-direction="+x">
                                                <span class="btn-label">X+</span>
                                                <span class="btn-arrow">→</span>
                                            </button>
                                        </div>
                                        <div class="axis-column">
                                            <button class="movement-btn" data-axis="y" data-direction="-y">
                                                <span class="btn-label">Y-</span>
                                                <span class="btn-arrow">↓</span>
                                            </button>
                                            <button class="movement-btn" data-axis="y" data-direction="+y">
                                                <span class="btn-label">Y+</span>
                                                <span class="btn-arrow">↑</span>
                                            </button>
                                        </div>
                                        <div class="axis-column">
                                            <button class="movement-btn" data-axis="z" data-direction="-z">
                                                <span class="btn-label">Z-</span>
                                                <span class="btn-arrow">↓</span>
                                            </button>
                                            <button class="movement-btn" data-axis="z" data-direction="+z">
                                                <span class="btn-label">Z+</span>
                                                <span class="btn-arrow">↑</span>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Homing Controls -->
                        <div class="control-section">
                            <h3>Homing</h3>
                            <div class="home-controls">
                                <button class="home-btn" data-axes="all">🏠 Home All</button>
                                <div class="home-individual">
                                    <button class="home-btn-small" data-axes="x">X</button>
                                    <button class="home-btn-small" data-axes="y">Y</button>
                                    <button class="home-btn-small" data-axes="z">Z</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Temperature Panel -->
                <div class="panel" id="temperaturePanel">
                    <div class="panel-header">
                        <h2>Temperature</h2>
                        <button class="panel-toggle" data-panel="temperature">−</button>
                    </div>
                    <div class="panel-content">
                        <!-- Temperature Controls -->
                        <div class="temp-controls">
                            <!-- Bed Temperature -->
                            <div class="temp-control-group">
                                <div class="temp-header">
                                    <label>Bed Temperature</label>
                                    <div class="temp-toggle">
                                        <input type="checkbox" id="bedTempToggle" class="temp-switch">
                                        <label for="bedTempToggle" class="switch-label">
                                            <span class="switch-slider"></span>
                                        </label>
                                    </div>
                                </div>
                                <div class="temp-display">
                                    <span id="bedTempCurrent">--</span>
                                    <span class="temp-separator">/</span>
                                    <span id="bedTempTarget">--</span>
                                </div>
                                <div class="temp-slider-container">
                                    <input type="range" id="bedTempSlider" class="temp-slider" min="0" max="120" value="0" step="5">
                                    <div class="temp-labels">
                                        <span>0°C</span>
                                        <span>120°C</span>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- Extruder Temperature -->
                            <div class="temp-control-group">
                                <div class="temp-header">
                                    <label>Extruder Temperature</label>
                                    <div class="temp-toggle">
                                        <input type="checkbox" id="extruderTempToggle" class="temp-switch">
                                        <label for="extruderTempToggle" class="switch-label">
                                            <span class="switch-slider"></span>
                                        </label>
                                    </div>
                                </div>
                                <div class="temp-display">
                                    <span id="extruderTempCurrent">--</span>
                                    <span class="temp-separator">/</span>
                                    <span id="extruderTempTarget">--</span>
                                </div>
                                <div class="temp-slider-container">
                                    <input type="range" id="extruderTempSlider" class="temp-slider" min="0" max="300" value="0" step="5">
                                    <div class="temp-labels">
                                        <span>0°C</span>
                                        <span>300°C</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </main>

        <!-- Footer -->

    </div>

    <!-- Scripts -->
    <script src="js/core/moonraker-api.js?v=1758394000"></script>
    <script src="js/core/api.js?v=1758394000"></script>
    <script src="js/core/state.js?v=1758394000"></script>
    <script src="js/core/ui.js?v=1758394000"></script>
    <script src="js/panels/status.js?v=1758394000"></script>
    <script src="js/panels/commissioning.js?v=1758394850"></script>
    <script src="js/panels/controls.js?v=1758394000"></script>
    <script src="js/panels/temperature.js?v=1758394000"></script>
    <script src="js/panels/console.js?v=1758394000"></script>
    <script src="js/app.js?v=1758394000"></script>
</body>
</html>
