#####################################################################
# PRINTER BUDDY - One-Click Printer Commissioning
#
# Drop-in commissioning system for new Klipper printers
# Just add [include printer_buddy/printer_buddy.cfg] to printer.cfg
# Then run START_COMMISSIONING macro from Mainsail
#
# Sources and References:
# - Klipper Documentation: https://www.klipper3d.org/
# - Mainsail Interface: https://docs.mainsail.xyz/
# - Moonraker API: https://moonraker.readthedocs.io/en/latest/
#
# To remove the symlink:
#   rm ~/mainsail/printer_buddy
#
# Additional cleanup for accurate testing:
#
# Remove any cached web files
#    rm -rf ~/mainsail/printer_buddy*
#
# Verify the symlink is gone
#   ls -la ~/mainsail/ | grep printer_buddy
# (Should show nothing)
#
# Verify our source files are still there
#   ls -la ~/printer_data/config/printer_buddy/www/
# (Should show index.html, style.css, etc.)
#
#
#
#####################################################################


[gcode_macro PRINTER_BUDDY]
description: Start Printer Buddy 2.0 - Automated setup and launch
gcode:
    RESPOND MSG="=== PRINTER BUDDY 2.0 Setup ==="
    RESPOND MSG="🔧 Setting up web interface..."
    RUN_SHELL_COMMAND CMD=setup_printer_buddy_web
    RESPOND MSG="🚀 Starting Printer Buddy system..."
    RUN_SHELL_COMMAND CMD=start_printer_buddy_system
    RESPOND MSG=""
    RESPOND MSG="✅ Setup Complete! Access your interface at:"
    RESPOND MSG="   🌐 Direct: http://your-printer-ip:8080"
    RESPOND MSG="   📱 Mainsail: http://your-printer-ip/printer_buddy/"
    RESPOND MSG=""
    RESPOND MSG="✨ Features Available:"
    RESPOND MSG="   • Real-time printer monitoring"
    RESPOND MSG="   • Safe commissioning tests"  
    RESPOND MSG="   • Emergency stop (bulletproof)"
    RESPOND MSG="   • Config-driven safety limits"
    RESPOND MSG="   • Modern responsive interface"
    RESPOND MSG="================================"

# Shell command to setup web interface symlink
[gcode_shell_command setup_printer_buddy_web]
command: sh -c 'ln -sf ~/printer_data/config/printer_buddy/web ~/mainsail/printer_buddy && echo "✅ Web interface linked successfully" || echo "❌ Web interface linking failed"'
timeout: 10.0
verbose: True


# Optional macro to stop Printer Buddy
[gcode_macro STOP_PRINTER_BUDDY]
description: Stop Printer Buddy system
gcode:
    RESPOND MSG="🛑 Stopping Printer Buddy system..."
    RUN_SHELL_COMMAND CMD=stop_printer_buddy_system
    RESPOND MSG="System stopped. Run PRINTER_BUDDY to restart."

