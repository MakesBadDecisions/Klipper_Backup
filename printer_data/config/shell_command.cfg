# Install G-Code Shell Command extension via KIAUH > Advanced menu first!
# Add [include shell_command.cfg] to your printer.cfg
# Shell Commands for Printer Buddy

[gcode_shell_command setup_printer_buddy_web]
command: sh -c "cp -r ~/printer_data/config/printer_buddy/www ~/mainsail/printer_buddy_temp && if [ -f ~/mainsail/printer_buddy_temp/index.html ]; then echo 'COPY_SUCCESS: Files copied successfully' && rm -rf ~/mainsail/printer_buddy && mv ~/mainsail/printer_buddy_temp ~/mainsail/printer_buddy && echo 'SETUP_COMPLETE: Web interface ready'; else echo 'COPY_FAILED: Could not verify files copied correctly' && rm -rf ~/mainsail/printer_buddy_temp; fi"
timeout: 30.0
verbose: True

# Shell command to start Printer Buddy system in background
[gcode_shell_command start_printer_buddy_system]
command: sh -c 'cd ~/printer_data/config/printer_buddy && mkdir -p logs && if curl -s http://localhost:8080/api/status > /dev/null 2>&1; then echo "✅ Printer Buddy already running on port 8080"; else echo "🚀 Starting Printer Buddy system..." && nohup python3 start_printer_buddy.py > logs/printer_buddy.log 2>&1 & sleep 3 && if curl -s http://localhost:8080/api/status > /dev/null 2>&1; then echo "✅ System started and responding"; else echo "❌ System starting - check logs/printer_buddy.log"; fi; fi'
timeout: 20.0
verbose: True

# Shell command to stop Printer Buddy system
[gcode_shell_command stop_printer_buddy_system]
command: sh -c 'pkill -f "start_printer_buddy.py" && echo "✅ Printer Buddy stopped" || echo "ℹ️ Printer Buddy was not running"'
timeout: 10.0
verbose: True
