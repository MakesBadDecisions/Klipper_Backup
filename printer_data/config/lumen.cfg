#####################################################################
##                    LUMEN Configuration
##
##  LED control configuration for LUMEN_RPI
##  
##  Edit this file to match your LED hardware setup.
##  After changes, restart Moonraker: sudo systemctl restart moonraker
#####################################################################

#--------------------------------------------------------------------
# Global Settings
#--------------------------------------------------------------------

# Maximum brightness for all LEDs (0.0 - 1.0)
# Recommended: 0.3-0.5 to avoid blinding yourself
max_brightness: 0.4

# Ambient temperature baseline (°C)
# Used for cooldown detection - printer is "cool" below this + margin
temp_floor: 25

# Bored timeout (seconds)
# How long to stay idle before switching to "bored" state
bored_timeout: 60

# Sleep timeout (seconds) 
# How long to stay bored before switching to "sleep" state
sleep_timeout: 60


#--------------------------------------------------------------------
# LED Groups
#
# Define your LED hardware here. Each group can use either:
#   - driver: gpio     → Direct Pi GPIO via rpi_ws281x (60fps animations)
#   - driver: klipper  → SET_LED command via Moonraker (MCU-attached LEDs)
#--------------------------------------------------------------------

# Example: Chamber lights on Pi GPIO (uncomment and edit)
# [lumen_group chamber_left]
# driver: gpio
# pin: 18                       # BCM pin number (18 = PWM0)
# led_count: 36                 # Number of LEDs in strip
# color_order: GRB              # Usually GRB for WS2812B

# [lumen_group chamber_right]
# driver: gpio
# pin: 21                       # BCM pin number
# led_count: 36
# color_order: GRB

# Toolhead LEDs via Klipper MCU (EBB42 CAN board)
# References [neopixel hotend_rgb] defined in printer.cfg
[lumen_group toolhead]
driver: klipper
neopixel: hotend_rgb
led_count: 6

# Chamber lights (PWM strip on main MCU)
# References [output_pin caselight] defined in printer.cfg
[lumen_group chamber]
driver: pwm
pin_name: caselight

#--------------------------------------------------------------------
# Event → Effect Mapping
#
# Format:  event: group=effect, group=effect:color, ...
#
# Effects:
#   solid (default)  - Static color
#   pulse            - Breathing animation
#   heartbeat        - Double-pulse pattern
#   thermal          - Color based on heater temps
#   progress         - Print progress bar
#   disco            - Random party colors
#   off              - LEDs off
#
# Colors:
#   See README.md for full list (40+ colors)
#   Common: red, green, blue, white, orange, cyan, purple, pink
#   Pastels: baby_blue, baby_pink, seafoam, lilac
#   Gaming: portal_blue, portal_orange, matrix, cyberpunk
#
# If no color specified, effect uses its default.
#--------------------------------------------------------------------

# Event mappings for QIDI X-Max
[lumen_events]
idle:       toolhead=solid:seafoam, chamber=on
heating:    toolhead=pulse:orange, chamber=on
printing:   toolhead=solid:white, chamber=on
cooldown:   toolhead=pulse:cyan, chamber=on
error:      toolhead=solid:red, chamber=on
bored:      toolhead=solid:purple, chamber=dim
sleep:      toolhead=off, chamber=off
