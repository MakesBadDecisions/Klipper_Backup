#####################################################################
##                    LUMEN Configuration
##
##  LED control for Klipper printers via Moonraker component.
##  
##  This file is read by the LUMEN Moonraker component, NOT Klipper.
##  After changes, restart Moonraker: sudo systemctl restart moonraker
##
##  Hardware definitions ([neopixel], [output_pin]) go in printer.cfg
##  or the appropriate board config (ebb42.cfg, etc.)
#####################################################################


#####################################################################
##                                                                 ##
##                    GLOBAL SETTINGS                              ##
##                                                                 ##
#####################################################################

[lumen_settings]
max_brightness: 0.4        # Global brightness cap (0.0-1.0)
temp_floor: 25             # Ambient temp baseline (°C)
bored_timeout: 30          # Seconds idle before "bored"
sleep_timeout: 60          # Seconds bored before "sleep"
# Klipper driver (SET_LED) - affects G-code queue
update_rate: 0.1           # Seconds between effect updates (10 Hz)
update_rate_printing: 1.0  # Slower during prints (Klipper safety)
# GPIO driver (rpi_ws281x) - Pi CPU only, no Klipper impact
gpio_fps: 60               # Frames per second (60 = smooth, 30 = Pi Zero safe)

#####################################################################
##                                                                 ##
##                    EFFECT SETTINGS                              ##
##                    (Tune how effects behave)                    ##
##                                                                 ##
#####################################################################

[lumen_effect pulse]
speed: 1.0                 # Cycles per second (1.0 = 1 sec breathe, 0.5 = 2 sec)
min_brightness: 0.2        # Dimmest point (0.0-1.0)
max_brightness: 0.8        # Brightest point (0.0-1.0)

[lumen_effect heartbeat]
speed: 1.2                 # Beats per second (1.2 = 72 BPM, resting heart rate)
min_brightness: 0.1
max_brightness: 1.0

[lumen_effect disco]
speed: 3.0                 # Color changes per second (higher = more chaotic)
min_sparkle: 1             # Minimum LEDs to light per update
max_sparkle: 6             # Maximum LEDs to light per update
max_brightness: 0.9

[lumen_effect thermal]
cold_color: ice
hot_color: lava

[lumen_effect progress]
start_color: steel
end_color: matrix
background: off


#####################################################################
##                                                                 ##
##                    GROUP A - TOOLHEAD                           ##
##                    (EBB42 CAN board neopixels)                  ##
##                                                                 ##
##  Hardware: [neopixel hotend_rgb] in ebb42.cfg                   ##
##  Chain: 6 LEDs                                                  ##
##    INDEX 1-2 : Emblem (status indicator)                        ##
##    INDEX 3-4 : Work Lights (nozzle illumination)                ##
##    INDEX 5-6 : Side Lights                                      ##
##                                                                 ##
##  Colors chosen to make each group visually distinct!            ##
##                                                                 ##
#####################################################################

[lumen_group emblem]
driver: klipper
neopixel: hotend_rgb
index_start: 1
index_end: 2
# Emblem: Status indicator with animated effects
on_idle: pulse seafoam
on_heating: solid orange
on_printing: solid cobalt
on_cooldown: pulse ice
on_error: heartbeat red
on_bored: disco
on_sleep: off

[lumen_group worklights]
driver: klipper
neopixel: hotend_rgb
index_start: 3
index_end: 4
# Worklights: Solid colors for illumination
on_idle: pulse steel
on_heating: solid lava
on_printing: solid white
on_cooldown: solid blue
on_error: solid red
on_bored: disco
on_sleep: off

[lumen_group sidelights]
driver: klipper
neopixel: hotend_rgb
index_start: 5
index_end: 6
# Sidelights: Accent lighting with disco on bored
on_idle: heartbeat hot_pink
on_heating: solid fire
on_printing: solid neon_green
on_cooldown: pulse sky
on_error: solid red
on_bored: disco
on_sleep: off


#####################################################################
##                                                                 ##
##                    GROUP B - CHAMBER                            ##
##                    (Main MCU PWM LED strip)                     ##
##                                                                 ##
##  Hardware: [output_pin caselight] in printer.cfg                ##
##  Type: Non-addressable PWM (brightness only, no color)          ##
##                                                                 ##
#####################################################################

[lumen_group chamber]
driver: pwm
pin_name: caselight
scale: 10                  # PWM scale (matches printer.cfg)
# Event → Brightness (on, off, dim, or 0.0-1.0)
on_idle: dim
on_heating: on
on_printing: on
on_cooldown: on
on_error: off
on_bored: dim
on_sleep: off


#####################################################################
##                                                                 ##
##                    AVAILABLE COLORS                             ##
##                                                                 ##
##  Basic: red, green, blue, white, black, off                     ##
##  Warm: orange, yellow, gold, amber, coral, salmon, warm_white   ##
##  Cool: cyan, teal, aqua, sky, ice, cool_white                   ##
##  Purple/Pink: purple, magenta, pink, hot_pink, violet, lavender ##
##  Green: lime, mint, emerald, forest                             ##
##  Special: fire, lava, sunset, ocean, steel, copper, rose        ##
##  Neon: neon_pink, neon_blue, neon_orange, neon_purple           ##
##  Pastel: baby_blue, baby_pink, seafoam, lilac, buttercup        ##
##  Gaming: vaporwave, cyberpunk, matrix, portal_blue, portal_orange##
##                                                                 ##
#####################################################################
