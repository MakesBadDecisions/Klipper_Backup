[heater_bed]
heater_pin: !PB2
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC2
control: pid
pid_kp = 76.739
pid_ki = 1.740
pid_kd = 846.044
min_temp: 0
max_temp: 120

[bed_screws]
screw1: 10,10
screw2: 290,10
screw3: 150,240


