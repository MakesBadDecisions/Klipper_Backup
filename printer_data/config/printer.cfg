
# This is a Klipper configuration for Qidi X-Max, with
# V4.9.1 motherboard. Based on printer.cfg for X-Max by Funkton.

#            === FIRMWARE BUILD ===
# 1. Enable extra low-level configuration options checkbox
# 2. Set MCU type to STMicroelectronics STM32
# 3. Choose processor model STM32F407
# 4. Set No bootloader option
# 5. For serial connection Uncheck USB, and leave default serial settings, USART1.
#    For USB option check box and leave defaults
# 6. For serial connection set Baud rate to 115200 (or adapter proferred). This value must match baud rate in printer.cfg file
# 7. Set (PE0, !PG10) as GPIO pins to set at startup. PE0 keeps on the power module and !PG10 turns on the board LED
# 8. Save changes and use make to build firmware.
# 9. Connect ST-LINK to mainboard SWD header and flash firmware.bin directly into user memory at 0x8000000

[include mainsail.cfg]
[include shell_command.cfg]
[include printer_buddy/printer_buddy.cfg]
# [include macros.cfg]
[include ebb42.cfg]

[gcode_arcs]
resolution: 0.1 # Optional: Change to a lower value for finer arcs, but use more processing power. Default is 1mm.

[mcu]
restart_method: command
serial: /dev/ttyS0

baud: 115200
# setup for PA9, PA10 USART1_tx / rx directly connected to the RPI GPIO TX / RX pins
# only connect GND, TX, RX - supply 5v power to the RPI separately
# cross over TX/RX
# Use "sudo raspi-config" to disable the serial terminal - but enable the serial port.
# Alternatively you can use the USB port for connection. USB port will require an A to A style cable.


[virtual_sdcard]
path: /home/teola/printer_data/gcodes
on_error_gcode: CANCEL_PRINT


[input_shaper]  			
shaper_type_x: mzv
shaper_freq_x: 44.8
damping_ratio_x:0.077
shaper_type_y: mzv
shaper_freq_y: 42.4
damping_ratio_y: 0.055

[printer]
kinematics: cartesian
max_velocity: 400
max_accel: 7000		        
max_z_velocity: 12
max_z_accel: 15
square_corner_velocity: 5.0

[stepper_x]

step_pin: PE5
dir_pin: PF1
enable_pin: !PF0
microsteps: 16
rotation_distance: 34 
endstop_pin: !PC15
position_endstop: 285
position_min: 0
position_max: 285
homing_retract_dist: 10
homing_speed: 30
second_homing_speed: 10

[stepper_y]
step_pin: PF9
dir_pin: PF3
enable_pin: !PF5
microsteps: 16
rotation_distance: 34
endstop_pin: !PC14
position_endstop: 230
position_max: 230
homing_retract_dist: 10
homing_speed: 30
second_homing_speed: 10

[stepper_z]
step_pin: PA6
dir_pin: PF15
enable_pin: !PA5
microsteps: 16
rotation_distance: 7.9672
endstop_pin: !PC13
position_endstop: 301.5			
position_max: 301.5			
position_min: -0.50
homing_retract_dist: 5
homing_speed: 12
second_homing_speed: 1

[stepper_z1]
step_pin: PD12
dir_pin: PG4
enable_pin: !PG5
microsteps: 16
rotation_distance: 8
endstop_pin: !PE6

