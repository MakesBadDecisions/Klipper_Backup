# ######################################################################
# # Print Start
# Add below to slicer start g-code
#   PRINT_START BED_TEMP=[first_layer_bed_temperature] EXTRUDER_TEMP=[first_layer_temperature]
# ######################################################################
[gcode_macro PRINT_START]
description: "Start print sequence with KAMP adaptive mesh and purge"
# Called from slicer with: PRINT_START BED_TEMP= EXTRUDER_TEMP=
variable_bed_temp: 0
variable_extruder_temp: 0
gcode:
    # Home axes and probe Z
    G28
    {% set bed_temp = params.BED_TEMP|default(60)|float %}
    {% set extruder_temp = params.EXTRUDER_TEMP|default(200)|float %}

    M117 Starting print...
    G90                             ; Absolute positioning
    M83                             ; Relative extrusion
    G92 E0                          ; Reset extruder position

    # Heat bed first for stability
    M140 S{bed_temp}
    M190 S{bed_temp}

    # Preheat nozzle to a safe probing temp (for example 150°C)
    M104 S150
    
    # Optional Z hop for safety
    G1 Z10 F600

    # KAMP adaptive bed mesh
    BED_MESH_CLEAR
    BED_MESH_CALIBRATE

    # Smart park before heating nozzle
    SMART_PARK
  
    # Wait for final nozzle temperature
    M104 S{extruder_temp}
    M109 S{extruder_temp}

    # Adaptive purge from KAMP
    LINE_PURGE
    
    # Retract filament to prevent oozing
    G1 E-20 F2700                  ; Retract 20mm
  
    M117 Printing...
    G1 E0
    G92 E0
    ; Ready to start the sliced print



# ######################################################################
# # Print End
# Add below to slicer end g-code
#  PRINT_END
# ######################################################################

[gcode_macro PRINT_END]
gcode:
    # Get printer dimensions
    {% set max_x = printer.toolhead.axis_maximum.x %}
    {% set max_y = printer.toolhead.axis_maximum.y %}
    {% set max_z = printer.toolhead.axis_maximum.z %}
    
    # Get current position
    {% set cur_z = printer.toolhead.position.z %}
    
    # Calculate safe lift height (minimum 10mm, but don't exceed max_z)
    {% set safe_z = [cur_z + 10, max_z]|min %}
    
    # Retract filament to prevent oozing
    G91                           ; Relative positioning
    G1 E-6 F2700                  ; Retract 2mm
    G1 E-10 Z1 F2400             ; Retract 2mm more and raise Z slightly
    
    # Turn off part cooling fan
    M106 S0
    
    # Turn off heaters
    M104 S0                       ; Turn off hotend
    M140 S0                       ; Turn off bed
    
    # Move to safe Z height
    G90                           ; Absolute positioning
    G0 Z{safe_z} F3000            ; Move to safe Z

    # Home X and Y
    G28 X Y
    
    # Home Z 
    G28 Z
    
    # Disable all steppers
    M84
    
    # Clear bed mesh
    BED_MESH_CLEAR
    
    # Final message
    M117 Print Complete!




# ######################################################################
# # PAUSE/RESUME
# ######################################################################

[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode:
    # Parameters
    {% set z = params.Z|default(10)|int %}                                                   ; z hop amount

    {% if printer['pause_resume'].is_paused|int == 0 %}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE={z}                              ; set z hop variable for reference in resume macro
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=etemp VALUE={printer['extruder'].target}    ; set hotend temp variable for reference in resume macro

        SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=0                                  ; disable filament sensor
        SAVE_GCODE_STATE NAME=PAUSE                                                          ; save current print position for resume
        BASE_PAUSE                                                                           ; pause print
        {% if (printer.gcode_move.position.z + z) < printer.toolhead.axis_maximum.z %}       ; check that zhop doesn't exceed z max
            G91                                                                              ; relative positioning
            G1 Z{z} F900                                                                     ; raise Z up by z hop amount
        {% else %}
            { action_respond_info("Pause zhop exceeds maximum Z height.") }                  ; if z max is exceeded, show message and set zhop value for resume to 0
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE=0
        {% endif %}
        G90                                                                                  ; absolute positioning
        G1 X{printer.toolhead.axis_maximum.x/2} Y{printer.toolhead.axis_minimum.y+5} F6000   ; park toolhead at front center
        SAVE_GCODE_STATE NAME=PAUSEPARK                                                      ; save parked position in case toolhead is moved during the pause (otherwise the return zhop can error)
        M104 S0                                                                              ; turn off hotend
        SET_IDLE_TIMEOUT TIMEOUT=43200                                                       ; set timeout to 12 hours
    {% endif %}

[gcode_macro RESUME]
rename_existing: BASE_RESUME
variable_zhop: 0
variable_etemp: 0
gcode:
    # Parameters
    {% set e = params.E|default(2.5)|int %}                                          ; hotend prime amount (in mm)

    {% if printer['pause_resume'].is_paused|int == 1 %}
        SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=1                          ; enable filament sensor
        #INITIAL_RGB                                                                    ; reset LCD color
        SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}  ; set timeout back to configured value
        {% if etemp > 0 %}
            M109 S{etemp|int}                                                        ; wait for hotend to heat back up
        {% endif %}
        RESTORE_GCODE_STATE NAME=PAUSEPARK MOVE=1 MOVE_SPEED=100                     ; go back to parked position in case toolhead was moved during pause (otherwise the return zhop can error)
        G91                                                                          ; relative positioning
        M83                                                                          ; relative extruder positioning
        {% if printer[printer.toolhead.extruder].temperature >= printer.configfile.settings.extruder.min_extrude_temp %}
            G1 Z{zhop * -1} E{e} F900                                                ; prime nozzle by E, lower Z back down
        {% else %}
            G1 Z{zhop * -1} F900                                                     ; lower Z back down without priming (just in case we are testing the macro with cold hotend)
        {% endif %}
        RESTORE_GCODE_STATE NAME=PAUSE MOVE=1 MOVE_SPEED=60                          ; restore position
        BASE_RESUME                                                                  ; resume print
    {% endif %}



# ######################################################################
# # Manual Bed leveling
# ######################################################################
[gcode_macro BED_LEVEL]
description: Manual 3-point bed leveling procedure
variable_current_point: 0
gcode:
    # Save current state
    SAVE_GCODE_STATE NAME=bed_level_state
    
    # Home if not already homed
    {% if printer.toolhead.homed_axes != "xyz" %}
        G28
    {% endif %}
    
    # Move to safe Z height
    G1 Z10 F3000
    
    # Set starting point
    SET_GCODE_VARIABLE MACRO=BED_LEVEL VARIABLE=current_point VALUE=1
    
    # Point 1 - Front Left
    G1 X10 Y10 F6000
    G1 Z0 F300
    M117 Point 1/3: Front Left - Run NEXT

[gcode_macro NEXT]
description: Move to next leveling point
gcode:
    {% set point = printer["gcode_macro BED_LEVEL"].current_point %}
    
    {% if point == 1 %}
        # Raise Z before moving
        G1 Z10 F3000
        
        # Point 2 - Front Right
        G1 X290 Y10 F6000
        G1 Z0 F300
        M117 Point 2/3: Front Right - Run NEXT
        SET_GCODE_VARIABLE MACRO=BED_LEVEL VARIABLE=current_point VALUE=2
        
    {% elif point == 2 %}
        # Raise Z before moving
        G1 Z10 F3000
        
        # Point 3 - Back Center
        G1 X150 Y240 F6000
        G1 Z0 F300
        M117 Point 3/3: Back Center - Run NEXT
        SET_GCODE_VARIABLE MACRO=BED_LEVEL VARIABLE=current_point VALUE=3
        
    {% elif point == 3 %}
        # Raise Z and return to center
        G1 Z10 F3000
        G1 X150 Y150 F6000
        M117 Bed leveling complete!
        SET_GCODE_VARIABLE MACRO=BED_LEVEL VARIABLE=current_point VALUE=0
        
        # Restore state
        RESTORE_GCODE_STATE NAME=bed_level_state
    {% else %}
        M117 Run BED_LEVEL first
    {% endif %}
    
